[project]
name = "crolyo-ingest-worker"
version = "0.1.0"
description = "Ingests knowledge sources (web pages, documents, text) into Supabase for the Crolyo AI agent."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "trafilatura>=2.0",
  "lxml>=5.3",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "charset-normalizer>=3.4",
  "semchunk>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
ingest-worker = "ingest_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ingest_worker"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "pdfplumber.*", "pypdfium2.*", "docx.*", "semchunk.*", "lxml.*"]
ignore_missing_imports = true
